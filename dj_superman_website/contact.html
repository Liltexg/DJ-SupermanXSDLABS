<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact DJ SupermanSA3 | Bookings & Inquiries</title>
    <meta name="description" content="Get in touch with DJ SupermanSA3 for bookings, collaborations, or inquiries. Fill out the contact form or connect via social media.">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>DJ Superman</h1>
    </header>
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="events.html">Events</a></li>
            <li><a href="music.html">Music</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>
    <main>
        <section id="contact-page">
            <h2>Get In Touch</h2>

            <section id="contact-form-section">
                <h3>Bookings & Inquiries</h3>
                <form id="contact-form">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="subject">Subject</label>
                        <input type="text" id="subject" name="subject" required>
                    </div>
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="6" required></textarea>
                    </div>
                    <button type="submit" class="form-button">Send Message</button>
                </form>
            </section>

            <section id="social-media-section">
                <h3>Connect on Social Media</h3>
                <div class="social-links">
                    <a href="https://www.tiktok.com/@djsupermansa3" target="_blank" class="social-link tiktok">TikTok</a>
                    <a href="https://www.youtube.com/@DJSUPERMANSA3" target="_blank" class="social-link youtube">YouTube</a>
                    <a href="#" class="social-link facebook">DJSupermanSA3 on Facebook</a>
                    <a href="#" class="social-link instagram">@djsupermansa3_sa on Instagram</a>
                </div>
            </section>
        </section>
    </main>
    <footer>
        <p>&copy; 2023 DJ Superman. All rights reserved.</p>
    </footer>
    <script src="js/script.js"></script>
</body>
</html>
